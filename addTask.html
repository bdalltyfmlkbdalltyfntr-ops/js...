<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add / Edit Task</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard">
        <div class="sidebar">
            <h2>AdminPanel</h2>
            <ul>
                <li class="active">Tasks</li>
                <li>Logout</li>
            </ul>
        </div>

        <main class="main-content">
            <header class="top-header">
                <span>Dashboard > Tasks > Add/Edit Task</span>
            </header>

            <section class="form-section">
                <div class="form-header">
                    <h2>Task Details</h2>
                    <p>Fill in the form below to create or update a task.</p>
                    <a href="index.html" class="btn-back">← Back to Tasks</a>
                </div>

                <form id="taskForm">
                    <div class="form-group">
                        <label>Task Name *</label>
                        <input type="text" id="taskName" placeholder="e.g. Design UI Layout" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Category *</label>
                            <select id="taskCategory" required>
                                <option value="">Select category...</option>
                                <option value="Development">Development</option>
                                <option value="Design">Design</option>
                                <option value="Testing">Testing</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Due Date *</label>
                            <input type="date" id="taskDate" required>
                        </div>
                    </div>

                    <div class="form-actions">
                        <a href="index.html" class="btn-cancel">Cancel</a>
                        <button type="submit" class="btn-save">✔ Save Task</button>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <script src="main.js"></script>
</body>
</html>
